[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "filing-to-factor-gap"
version = "0.1.0"
description = "Point-in-time asset pricing with as-filed fundamentals and reporting complexity."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Nima Taheri"}]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pyarrow>=14",
  "scipy>=1.10",
  "statsmodels>=0.14",
  "scikit-learn>=1.3",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "requests>=2.31",
  "PyYAML>=6.0",
  "tqdm>=4.66",
]

[project.optional-dependencies]
wrds = ["wrds>=3.2", "psycopg2-binary>=2.9"]
ml = ["lightgbm>=4.3", "optuna>=3.6", "shap>=0.45"]
deep = ["torch>=2.2"]
docs = ["mkdocs>=1.6", "mkdocs-material>=9.5"]
dev = ["pytest>=8.0", "ruff>=0.8"]
all = [
  "wrds>=3.2",
  "psycopg2-binary>=2.9",
  "lightgbm>=4.3",
  "optuna>=3.6",
  "shap>=0.45",
  "torch>=2.2",
  "pytest>=8.0",
  "ruff>=0.8",
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
]

[project.scripts]
ftfg = "ftfg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
